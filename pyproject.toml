[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "berylx-py"
version = "0.1.0"
description = "Immutable state workflows over a tagged Freer effect monad"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{name = "minamorl"}]

[project.urls]
Homepage = "https://github.com/minamorl/berylx-py"
Repository = "https://github.com/minamorl/berylx-py"
Issues = "https://github.com/minamorl/berylx-py/issues"
Documentation = "https://github.com/minamorl/berylx-py#readme"

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "build>=1", "ruff>=0.9", "mypy>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
