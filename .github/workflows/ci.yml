name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e .
      - name: Regression and Unit barrier
        run: python -m pytest -q tests/test_regression.py tests/test_darkcore.py tests/test_oracle.py tests/test_boundaries.py tests/test_timeline.py
      - name: Property barrier
        run: python -m pytest -q tests/test_properties.py
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: mypy src/berylx
      - run: python -m build
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes prettier@3.6.2 --check README.md 'docs/**/*.md' '.github/**/*.yml' 'tests/fixtures/*.json'
